apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: react
    tier: frontend
  name: react-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
      tier: frontend
  strategy: { }
  template:
    metadata:
      labels:
        app: react
        tier: frontend
    spec:
      containers:
        - image: de.carsten.spring-react.frontend:1.0.0-SNAPSHOT
          imagePullPolicy: Never
          name: react-frontend
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: 100Mi
              cpu: 1000m
      automountServiceAccountToken: false