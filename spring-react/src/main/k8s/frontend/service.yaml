apiVersion: v1
kind: Service
metadata:
  labels:
    app: frontend-svc
    tier: frontend
  name: frontend
spec:
  ports:
    - name: 8082-80
      port: 8082
      protocol: TCP
      targetPort: 80
  selector:
    app: react
    tier: frontend
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: frontend
                port:
                  number: 8082
