[versions]
activityCompose = "1.10.1"
agp = "8.12.1"
appcompat = "1.7.1"
charts = "v3.1.0"
coil = "2.7.0"
composeBom = "2025.08.00"
coreKtx = "1.17.0"
coreSplash = "1.0.1"
espressoCore = "3.7.0"
exoPlayer = "1.8.0"
foundationLayout = "1.9.0"
junit = "4.13.2"
junitVersion = "1.3.0"
koin = "4.1.0"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
ktlint = "13.0.0"
lifecycleKtx = "2.9.2"
material = "1.12.0"
mp3agic = "0.9.1"
navigation = "2.9.3"
permissions = "0.37.3"
room = "2.7.2"
runtimeLivedata = "1.9.0"

[libraries]
# android core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplash" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleKtx" }
androidx-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# jetpack compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-ext = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "runtimeLivedata" }
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundationLayout" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleKtx" }

# exo player
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoPlayer" }
media3-exoplayer-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "exoPlayer" }
media3-exoplayer-common = { group = "androidx.media3", name = "media3-common-ktx", version.ref = "exoPlayer" }

# room
androidx-room = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ui
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# koin
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-android-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# coil
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# permissions
permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "permissions" }

# charts
charts = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "charts" }

# id3
mp3agic = { group = "com.mpatric", name = "mp3agic", version.ref = "mp3agic" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
